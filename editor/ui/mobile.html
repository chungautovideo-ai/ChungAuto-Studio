<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ContentOS · Gửi tư liệu</title><style>body{margin:0;background:#0c0c0e;color:#eee;font:16px/1.5 system-ui;padding:24px}main{max-width:600px;margin:auto}button{padding:14px;border:0;border-radius:12px;background:#d8ff3e;color:#111;font-weight:700;margin:8px 0;width:100%}input{max-width:100%}li{margin:12px 0;overflow-wrap:anywhere}small,p{color:#bbb}progress{width:100%}</style></head><body><main><h1>Gửi tư liệu</h1><h2 id="title">Đang kết nối…</h2><p id="expiry"></p><button id="choose" disabled>Chọn video / ảnh / âm thanh</button><button id="camera" disabled>Quay video / chụp ảnh</button><input id="files" type="file" multiple accept="video/*,image/*,audio/*" hidden><input id="capture" type="file" accept="video/*,image/*" capture="environment" hidden><progress id="progress" max="100" value="0"></progress><p id="status" role="status" aria-live="polite"></p><ul id="results"></ul><p>Giữ màn hình sáng khi tải. File lớn tối đa 2 GiB; mất mạng cần gửi lại. File chỉ vào dự án được cấp, không cấp quyền điều khiển máy hoặc AI. Link LAN dùng khi cùng mạng, chưa hỗ trợ Internet.</p></main><script>
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);const $=id=>document.getElementById(id);let busy=false;
async function session(){const r=await fetch('/session',{headers:{'X-Upload-Token':token}});const j=await r.json();if(!r.ok)throw new Error(j.error);$('title').textContent=j.title;$('expiry').textContent='Hết hạn: '+new Date(j.expiresAt).toLocaleString();$('choose').disabled=false;$('camera').disabled=false;return j;}
function send(file){return new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('POST','/upload?name='+encodeURIComponent(file.name));x.setRequestHeader('X-Upload-Token',token);x.upload.onprogress=e=>{if(e.lengthComputable){$('progress').value=e.loaded/e.total*100;$('status').textContent=e.loaded===e.total?'Máy đang kiểm tra file…':'Đang tải '+file.name;}};x.onload=()=>{try{const j=JSON.parse(x.responseText);if(x.status>=200&&x.status<300)resolve(j);else reject(new Error(j.error));}catch(e){reject(e);}};x.onerror=()=>reject(new Error('Mất kết nối. Kiểm tra WiFi/máy dựng và gửi lại.'));x.send(file);});}
async function upload(files){if(busy)return;busy=true;$('choose').disabled=$('camera').disabled=true;try{for(const file of files){const row=document.createElement('li');row.textContent=file.name+' · chờ gửi';$('results').append(row);try{const r=await send(file);row.textContent=file.name+(r.duplicate?' · đã nhận trước đó':' · máy đã nhận và kiểm tra');}catch(e){row.textContent=file.name+' · '+e.message;}}$('status').textContent='Đã xử lý danh sách file. Có thể chọn lại file lỗi để gửi.';}finally{busy=false;$('choose').disabled=$('camera').disabled=false;}}
$('choose').onclick=()=>$('files').click();$('camera').onclick=()=>$('capture').click();for(const id of ['files','capture'])$(id).onchange=e=>{upload(Array.from(e.target.files));e.target.value='';};session().catch(e=>{$('title').textContent='Không kết nối được';$('status').textContent=e.message;});
</script></body></html>
